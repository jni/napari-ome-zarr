---
name: napari-ome-zarr
schema_version: 0.1.0
contributions:
  commands:
    - id: napari-ome-zarr.get_reader
      title: Get Reader
      python_name: napari_ome_zarr._reader:napari_get_reader
    - id: napari-ome-zarr.add_orientation_markers
      title: Add Orientation Markers
      python_name: napari_ome_zarr._orientation:add_orientation_markers
  readers:
    - command: napari-ome-zarr.get_reader
      filename_patterns:
        - "*.zarr"
        - "*.zarr*"
      accepts_directories: true
  menus:
    napari/layers/visualize:
      - command: napari-ome-zarr.add_orientation_markers
